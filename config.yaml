# agenda-watch configuration
# Edit terms and sources here; no code changes needed.

settings:
  lookback_days: 10          # re-check meetings this many days back (late-posted minutes, amendments)
  lookahead_days: 60         # and this far ahead (agendas usually post 3–7 days before a meeting)
  report_lookback_days: 30   # the report shows meetings back this far (already-read ones aren't re-fetched)
  database: data/agenda_watch.db
  report_dir: reports       # the site (index.html, data.json, feed.xml, upcoming.ics) is written here
  # site_url: https://agendas.example.org   # where the site is hosted; makes feed links absolute
  max_download_mb: 250       # skip agenda packets bigger than this (Dallas County PDFs run 100+ MB)
  request_delay_seconds: 1.0 # pause between requests to the same site
  ocr: auto                  # auto = OCR scanned PDFs if ocrmypdf is installed; off = never
  snippet_chars: 140         # context shown on each side of a match
  max_snippets_per_term: 5   # per agenda, so one long packet doesn't flood the report
  stale_after_days: 30       # flag a source with no new agenda for this long (0 = off); per-source override too
  lead_window_days: 180      # lead time ("notice") is measured over meetings first seen in this window
  page_retention_days: 0     # drop stored page text for meetings older than this (0 = keep all;
                             # matches are always kept). Full-text search covers only pages still kept.
  search_index: true         # build the full-text search index (needs the pagefind package)

# ------------------------------------------------------------------ key terms
# Plain phrases match whole words, ignore case, and tolerate line breaks inside the phrase.
# Options: case_sensitive, regex (pattern is a regular expression), whole_word,
#          exclude_if_nearby (skip a match when one of these phrases is within ~150 characters),
#          exclude_context (skip a match only when one of these regexes covers the match itself),
#          require_nearby (count a match only when one of these phrases is within ~150 characters),
#          aliases (other spellings reported as this term: a phrase, or {pattern, regex, case_sensitive}),
#          tags (group:value — groups used: agency, mode, topic; shown and filterable on the site).
# Where terms overlap, the longest match wins: "Transit" inside "Dallas Area Rapid Transit" or
# "transit-oriented development" counts only as the longer term.
# Keep term names stable: a name is part of each passage's fingerprint, so renaming a term makes
# its existing passages look new once.
terms:
  # --- agencies and providers
  - name: DART
    case_sensitive: true          # so "dart" / "Dart Container" don't match
    aliases: [Dallas Area Rapid Transit]
    tags: [agency:DART]
  - name: DCTA
    case_sensitive: true
    aliases: [Denton County Transportation Authority]
    tags: [agency:DCTA]
  - name: Trinity Metro
    tags: [agency:Trinity Metro]
  - name: STAR Transit            # Rockwall / Kaufman area
    tags: [agency:STAR Transit, mode:bus]
  - name: SPAN                    # Denton County rural transit; bare "span" is a bridge word
    pattern: 'Special\s+Programs\s+for\s+Aging\s+Needs|SPAN,?\s+(?:Inc\b|Transit|Transportation)'
    regex: true
    case_sensitive: true
    tags: [agency:SPAN, mode:on-demand]
  - name: Collin County Transit
    tags: [agency:Collin County Transit, mode:on-demand]
  - name: M-Line trolley          # McKinney Avenue Transit Authority (Uptown)
    pattern: 'McKinney\s+Avenue\s+Transit\s+Authority|M-Line(?:\s+trolley)?|MATA\b'
    regex: true
    case_sensitive: true
    tags: [agency:MATA, mode:streetcar]

  # --- rail
  - name: Silver Line
    pattern: 'Silver\s+Line|Cotton\s+Belt'
    regex: true
    tags: [agency:DART, mode:rail]
  - name: TEXRail
    tags: [agency:Trinity Metro, mode:rail]
  - name: TRE
    pattern: 'Trinity\s+Railway\s+Express|TRE'
    regex: true
    case_sensitive: true
    exclude_context:              # "TRE" is also someone's initials in Dallas County agendas
      - 'TRE\s*/\s*TRE'
      - 'TRE\s+Thomas'
    tags: [agency:Trinity Metro, agency:DART, mode:rail]
  - name: Light rail
    pattern: 'light[\s\-]rail'
    regex: true
    tags: [mode:rail]
  - name: D2 subway
    pattern: 'D2\s+(?:subway|line|alignment|project)'
    regex: true
    tags: [agency:DART, mode:rail]
  - name: High-speed rail
    pattern: 'high[\s\-]speed\s+(?:rail|train)'
    regex: true
    tags: [mode:rail, topic:intercity rail]
  - name: Amtrak
    aliases: [Heartland Flyer, Texas Eagle]   # Amtrak's routes through DFW
    tags: [mode:rail, topic:intercity rail]
  - name: Passenger rail
    pattern: 'passenger\s+(?:rail|trains?)'
    regex: true
    tags: [mode:rail, topic:intercity rail]
  - name: Streetcar
    pattern: 'street[\s\-]?cars?'   # street car, streetcar, street-car, streetcars
    regex: true
    tags: [mode:streetcar]

  # --- bus
  - name: Bus rapid transit
    pattern: 'bus\s+rapid\s+transit|BRT'
    regex: true
    case_sensitive: false
    exclude_context: ['(?-i:\bbrt\b)']   # only the upper-case acronym
    tags: [mode:bus]
  - name: Bus stop or shelter
    pattern: 'bus\s+(?:stops?|shelters?)'
    regex: true
    tags: [mode:bus]
  - name: Park-and-ride
    pattern: 'park[\s\-]*(?:and|&|n)[\s\-]*ride'
    regex: true
    tags: [mode:bus]

  # --- on-demand and paratransit
  - name: GoLink
    tags: [agency:DART, mode:on-demand]
  - name: Microtransit
    pattern: 'micro[\s\-]?transit'
    regex: true
    tags: [mode:on-demand]
  - name: On-demand transit
    pattern: 'on[\s\-]demand\s+(?:transit|transportation|rideshare|ride[\s\-]?share|service)|Arlington\s+On[\s\-]Demand|Via\s+(?:Transportation|rideshare)'
    regex: true
    tags: [mode:on-demand]
  - name: Paratransit
    pattern: 'para[\s\-]?transit'   # paratransit, para-transit, para transit
    regex: true
    tags: [mode:paratransit]

  # --- policy, funding and planning
  - name: GMP
    case_sensitive: true
    exclude_if_nearby:            # construction contracts use GMP for "Guaranteed Maximum Price"
      - guaranteed maximum price
      - guaranteed maximum
      - construction manager at risk
      - CMAR
    require_nearby:               # construction contracts also say "GMP Amendment 3" with no other hint;
      - DART                      # DART's General Mobility Program nearly always has one of these close by
      - Dallas Area Rapid Transit
      - mobility
    aliases: [General Mobility Program]
    tags: [agency:DART, topic:funding]
  - name: DART membership
    pattern: 'withdraw(?:al|ing|n)?\s+(?:from\s+)?(?:DART|Dallas\s+Area\s+Rapid\s+Transit)|(?:DART|transit)\s+withdrawal|withdrawal\s+election|(?:DART|transit)\s+sales\s+tax|DART\s+member\s+cit(?:y|ies)|member\s+cit(?:y|ies)\s+of\s+DART'
    regex: true
    tags: [agency:DART, topic:DART membership]
  - name: Transit-oriented development
    pattern: 'transit[\s\-]+oriented\s+development|(?-i:\bTOD\b)'
    regex: true
    tags: [topic:TOD & land use]
  - name: Complete Streets
    tags: [topic:active transportation]
  - name: Bicycle and pedestrian
    pattern: 'bicycle\s+and\s+pedestrian|bike\s*(?:/|and|&)\s*ped(?:estrian)?|active\s+transportation'
    regex: true
    tags: [topic:active transportation]
  - name: Transit                 # broad on purpose
    exclude_context:              # not public transit
      - 'ford\s+transit'
      - 'transit\s+(?:connect|van|cargo|custom)'
      - '\bin[\s\-]+transit\b'
      - 'transit\s+time'

# ------------------------------------------------------------------ action tags
# Labels for what an agenda item does, found in the text around each match. A mention with an
# action tag is likely a real item (a vote, a contract, a hearing) rather than a passing reference.
actions:
  agreement: 'interlocal|\bILA\b|memorandum\s+of\s+understanding|\bMOU\b|agreement'
  contract: '\bcontract|\baward|\bpurchase|\bbid\b|procurement|\bRFP\b|\bRFQ\b'
  resolution or ordinance: '\bresolution\b|\bordinance\b'
  public hearing: 'public\s+hearing'
  briefing: '\bbriefing|\bpresentation|work\s+session'
  appointment: '\bappoint|\bnominat|\breappoint'
  budget or funding: '\bbudget|\bfunding|\bgrant\b|\bappropriat|\bsales\s+tax'
  election: '\belection\b'

# ------------------------------------------------------------------ sources
# type: legistar  — client is the name before .legistar.com
# type: novus     — base_url is the NovusAGENDA "agendapublic" folder
# type: link_page — any page linking to agendas; link_pattern picks which links are agendas
# type: civicclerk — tenant is the name before .portal.civicclerk.com
# type: docspublished — org is the name after docspublished.io/
# type: granicus  — url is a Granicus ViewPublisher.php?view_id=N page
# type: civicweb  — base_url is the CivicWeb site; meeting_types names folders under Document Center → Agendas
# type: doc_table — a page with a table row per meeting; columns names which document columns to read
# Optional on any source:  section: "DCTA member cities"  (groups sources in the report, in config order)
#                          user_agent: browser  (for sites that refuse non-browser clients)
#                          bodies: ["City Council", "Transportation"]  (only meetings whose name contains one)
#                          enabled: false
sources:
  - name: Dallas
    section: DART member cities
    type: legistar
    client: cityofdallas
    # Dallas posts agendas for dozens of boards. To narrow it, uncomment:
    # bodies: ["City Council", "Briefing", "Transportation and Infrastructure"]
    attachments: none           # none | names (also search item titles & attachment names) | download

  - name: Farmers Branch
    section: DART member cities
    type: legistar
    client: farmersbranch

  - name: Plano
    section: DART member cities
    type: legistar
    client: plano           # moved from NovusAGENDA to Legistar in July 2026

  - name: Richardson
    section: DART member cities
    type: doc_table
    # cor.net posts the agenda and packet about 6 days before each council meeting.
    # The site blocks non-browser clients, so requests to it identify as a browser.
    urls:
      - https://www.cor.net/government/city-council/council-meeting-documents
    user_agent: browser
    columns: [agenda, packet]

  - name: Richardson (video archive)
    section: DART member cities
    city: Richardson
    type: swagit
    # Fallback for cloud hosting: cor.net blocks data-center IPs (Akamai). Swagit lists a meeting
    # around when it's held, so alerts from here come late; when cor.net is readable (e.g. from a
    # home connection) it catches the same items first. Also the archive back to 2009.
    note: "Fallback for cor.net; agendas appear here around meeting day, so notice is short."
    host: richardsontx
    view: 614                       # https://richardsontx.new.swagit.com/views/614

  - name: Irving (video archive)
    section: DART member cities
    city: Irving
    type: swagit
    # irvingtx.gov is behind a Cloudflare challenge (see Phase 6). Irving's Swagit archive has
    # agendas from 2009 until July 2025, when Irving stopped posting there: history only.
    note: "Archive only: Irving's Swagit agendas end July 2025. Current Irving agendas aren't covered yet."
    stale_after_days: 3650          # the archive is closed, so don't flag it as stale
    host: irvingtx
    view: 697
    tab: meetings                   # https://irvingtx.new.swagit.com/views/697/meetings

  - name: Rowlett
    section: DART member cities
    type: civicclerk
    tenant: rowletttx

  - name: Garland
    section: DART member cities
    type: civicclerk
    tenant: garlandtx
    # Garland posts agendas for many boards. To narrow it, uncomment:
    # bodies: ["City Council", "Development Services", "Plan Commission"]

  - name: Carrollton
    section: DART member cities
    type: legistar
    client: carrolltontx

  - name: University Park
    section: DART member cities
    type: legistar
    client: uptexas

  - name: Addison
    section: DART member cities
    type: link_page
    urls:
      - https://agendas.addisontx.gov/agenda_publish.cfm
      - https://agendas.addisontx.gov/agenda_publish.cfm?id=&mt=ALL&get_month={month}&get_year={year}&dsp=ag&seq=
    months_back: 1
    link_pattern: '/docs/\d{4}/[^?#]+\.pdf'
    follow_pattern: 'agenda_publish\.cfm\?.*seq=\d+'   # meeting pages that hold the PDF links
    max_links: 30

  # ---------------------------------------------------------------- DCTA member cities
  - name: Denton
    type: legistar
    client: denton-tx
    section: DCTA member cities

  - name: Lewisville
    type: legistar
    client: cityoflewisville
    section: DCTA member cities

  - name: Highland Village
    type: link_page
    # CivicPlus Archive Center: 50 = City Council agendas, 57 = special meeting agendas.
    urls:
      - https://www.highlandvillage.org/Archive.aspx?AMID=50
      - https://www.highlandvillage.org/Archive.aspx?AMID=57
    link_pattern: 'Archive\.aspx\?ADID=\d+'
    link_text_pattern: '^(?!.*cancel)'     # skip "November 24, 2026 - Canceled"
    meeting_name: City Council
    max_links: 40
    section: DCTA member cities

  # ---------------------------------------------------------------- Trinity Metro member & associate cities
  # Fort Worth is the full (sales-tax) member; the others have partial/associate
  # membership through interlocal agreements (TEXRail stations, On-Demand, paratransit).
  - name: Fort Worth
    type: docspublished
    org: fortworthtexas      # moved from Legistar (fortworthgov) on June 17, 2026
    # Reads each agenda's sections, item titles and attachment titles. The full agenda
    # PDFs (100-350 MB) aren't available through the public API.
    section: Trinity Metro member & associate cities

  - name: Grapevine
    type: link_page
    # CivicPlus Archive Center: 48 = City Council agendas, 52 = City Council packets.
    urls:
      - https://www.grapevinetexas.gov/Archive.aspx?AMID=48
      - https://www.grapevinetexas.gov/Archive.aspx?AMID=52
    link_pattern: 'Archive\.aspx\?ADID=\d+'
    link_text_pattern: '^(?!.*(cancel|no meeting))'
    meeting_name: City Council
    skip_undated: true
    max_links: 40
    section: Trinity Metro member & associate cities

  - name: North Richland Hills
    type: legistar
    client: nrhtx
    section: Trinity Metro member & associate cities

  - name: Forest Hill
    type: civicclerk
    tenant: foresthilltx
    section: Trinity Metro member & associate cities

  - name: River Oaks
    type: link_page
    # CivicPlus Agenda Center; links look like /AgendaCenter/ViewFile/Agenda/_11172026-421
    urls:
      - https://www.riveroakstx.com/AgendaCenter
    link_pattern: '/AgendaCenter/ViewFile/Agenda/_\d{8}-\d+'
    exclude_pattern: 'municipal court'   # court dockets aren't meeting agendas
    skip_undated: true
    max_links: 40
    section: Trinity Metro member & associate cities

  # ---------------------------------------------------------------- regional bodies
  - name: RTC (NCTCOG)
    section: Regional
    city: Regional Transportation Council
    type: link_page
    # NCTCOG lists each RTC meeting's agenda and full packet ("Agenda (including all meeting
    # materials)"); the date comes from the file name, e.g. agendapacketrtc11052026.pdf.
    urls:
      - https://www.nctcog.org/trans/about/committees/regional-transportation-council
    link_pattern: '/getContentAsset/.+\.pdf'
    link_text_pattern: '^Agenda'
    meeting_name: Regional Transportation Council
    skip_undated: true        # 2022-23 archive files have no usable date in their names
    max_links: 60

  # ---------------------------------------------------------------- counties
  - name: Dallas County
    section: Counties
    type: civicweb
    base_url: https://dallascounty.civicweb.net
    meeting_types: ["Commissioners Court", "Commissioners Court - Special Called Session"]
    # html = agenda item titles (~200 KB, available right away); pdf = the full agenda with
    # every briefing (often 100+ MB, ~3 min to read; needs max_download_mb above its size).
    format: both

  - name: Collin County
    type: link_page
    # eAgenda portal (same software as Addison). Each meeting's page is the full agenda with
    # item descriptions, so read those pages rather than the hundreds of attachment PDFs.
    urls:
      - https://eagenda.collincountytx.gov/agenda_publish.cfm
      - https://eagenda.collincountytx.gov/agenda_publish.cfm?id=&mt=ALL&get_month={month}&get_year={year}&dsp=ag&seq=
    months_back: 1
    link_pattern: 'agenda_publish\.cfm\?.*dsp=ag&seq=\d+'
    skip_undated: true
    max_links: 30
    section: Counties

  - name: Denton County
    type: granicus
    # Commissioners Court agendas go up under "Upcoming Events" before each meeting.
    url: https://dentoncounty.granicus.com/ViewPublisher.php?view_id=26
    section: Counties

  # Tarrant County: its agendas are only in an AgendaLink portal whose API needs a token
  # embedded in the app, so it isn't read here. See README.

