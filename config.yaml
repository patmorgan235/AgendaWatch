# agenda-watch configuration
# Edit terms and sources here; no code changes needed.

settings:
  lookback_days: 10          # re-check meetings this many days back (late-posted minutes, amendments)
  lookahead_days: 60         # and this far ahead (agendas usually post 3–7 days before a meeting)
  report_lookback_days: 30   # the report shows meetings back this far (already-read ones aren't re-fetched)
  database: data/agenda_watch.db
  report_dir: reports       # the site (index.html, data.json, feed.xml, upcoming.ics) is written here
  # site_url: https://agendas.example.org   # where the site is hosted; makes feed links absolute
  max_download_mb: 250       # skip agenda packets bigger than this (Dallas County PDFs run 100+ MB)
  request_delay_seconds: 1.0 # pause between requests to the same site
  ocr: auto                  # auto = OCR scanned PDFs if ocrmypdf is installed; off = never
  snippet_chars: 140         # context shown on each side of a match
  max_snippets_per_term: 5   # per agenda, so one long packet doesn't flood the report
  stale_after_days: 30       # flag a source with no new agenda for this long (0 = off); per-source override too
  lead_window_days: 180      # lead time ("notice") is measured over meetings first seen in this window
  page_retention_days: 0     # drop stored page text for meetings older than this (0 = keep all;
                             # matches are always kept). Hosted runs set 90 to keep the database small.

# ------------------------------------------------------------------ Google Calendar (optional)
# Push meetings with mentions into Google Calendars you own, right after each hosted run
# (`agenda_watch.py gcal --dry-run` previews it). A meeting goes to every calendar whose key is
# its city, its section, or "*". Needs a service account; see docs/runbook.md "Google Calendar sync".
# Anyone can also just subscribe to the published feeds/city/<city>.ics without any of this.
# google_calendar:
#   calendars:
#     Plano: abc123@group.calendar.google.com
#     "DART member cities": def456@group.calendar.google.com
#     "*": all789@group.calendar.google.com

# ------------------------------------------------------------------ key terms
# Plain phrases match whole words, ignore case, and tolerate line breaks inside the phrase.
# Options: case_sensitive, regex (pattern is a regular expression), whole_word,
#          exclude_if_nearby (skip a match when one of these phrases is within ~150 characters).
terms:
  - name: DART
    case_sensitive: true          # so "dart" / "Dart Container" don't match
  - name: Dallas Area Rapid Transit
  - name: Transit                 # broad on purpose; also catches "transit-oriented development"
  - name: GMP
    case_sensitive: true
    exclude_if_nearby:            # construction contracts use GMP for "Guaranteed Maximum Price"
      - guaranteed maximum price
      - guaranteed maximum
      - construction manager at risk
      - CMAR
  - name: General Mobility Program
  - name: DCTA
    case_sensitive: true
  - name: Denton County Transportation Authority
  - name: Trinity Metro
  - name: Paratransit
    pattern: 'para[\s\-]?transit'   # paratransit, para-transit, para transit
    regex: true
  - name: Streetcar
    pattern: 'street[\s\-]?cars?'   # street car, streetcar, street-car, streetcars
    regex: true

# ------------------------------------------------------------------ sources
# type: legistar  — client is the name before .legistar.com
# type: novus     — base_url is the NovusAGENDA "agendapublic" folder
# type: link_page — any page linking to agendas; link_pattern picks which links are agendas
# type: civicclerk — tenant is the name before .portal.civicclerk.com
# type: docspublished — org is the name after docspublished.io/
# type: granicus  — url is a Granicus ViewPublisher.php?view_id=N page
# type: civicweb  — base_url is the CivicWeb site; meeting_types names folders under Document Center → Agendas
# type: doc_table — a page with a table row per meeting; columns names which document columns to read
# Optional on any source:  section: "DCTA member cities"  (groups sources in the report, in config order)
#                          user_agent: browser  (for sites that refuse non-browser clients)
#                          bodies: ["City Council", "Transportation"]  (only meetings whose name contains one)
#                          enabled: false
sources:
  - name: Dallas
    section: DART member cities
    type: legistar
    client: cityofdallas
    # Dallas posts agendas for dozens of boards. To narrow it, uncomment:
    # bodies: ["City Council", "Briefing", "Transportation and Infrastructure"]
    attachments: none           # none | names (also search item titles & attachment names) | download

  - name: Farmers Branch
    section: DART member cities
    type: legistar
    client: farmersbranch

  - name: Plano
    section: DART member cities
    type: legistar
    client: plano           # moved from NovusAGENDA to Legistar in July 2026

  - name: Richardson
    section: DART member cities
    type: doc_table
    # cor.net posts the agenda and packet about 6 days before each council meeting.
    # The site blocks non-browser clients, so requests to it identify as a browser.
    urls:
      - https://www.cor.net/government/city-council/council-meeting-documents
    user_agent: browser
    columns: [agenda, packet]

  - name: Richardson (video archive)
    section: DART member cities
    city: Richardson
    type: link_page
    # Fallback for cloud hosting: cor.net blocks data-center IPs (Akamai). Swagit is expected to
    # work from Azure but wasn't part of the Phase 0 test; confirm on the first Azure run.
    # Swagit lists a meeting around when it's held, so alerts from here come late; when
    # cor.net is readable (e.g. from a home connection) it catches the same items first.
    note: "Fallback for cor.net; agendas appear here around meeting day, so notice is short."
    urls:
      - https://richardsontx.new.swagit.com/views/614
    link_pattern: '/videos/\d+/agenda'
    link_text_pattern: '^agenda$'
    max_links: 15

  - name: Rowlett
    section: DART member cities
    type: civicclerk
    tenant: rowletttx

  - name: Garland
    section: DART member cities
    type: civicclerk
    tenant: garlandtx
    # Garland posts agendas for many boards. To narrow it, uncomment:
    # bodies: ["City Council", "Development Services", "Plan Commission"]

  - name: Carrollton
    section: DART member cities
    type: legistar
    client: carrolltontx

  - name: University Park
    section: DART member cities
    type: legistar
    client: uptexas

  - name: Addison
    section: DART member cities
    type: link_page
    urls:
      - https://agendas.addisontx.gov/agenda_publish.cfm
      - https://agendas.addisontx.gov/agenda_publish.cfm?id=&mt=ALL&get_month={month}&get_year={year}&dsp=ag&seq=
    months_back: 1
    link_pattern: '/docs/\d{4}/[^?#]+\.pdf'
    follow_pattern: 'agenda_publish\.cfm\?.*seq=\d+'   # meeting pages that hold the PDF links
    max_links: 30

  # ---------------------------------------------------------------- DCTA member cities
  - name: Denton
    type: legistar
    client: denton-tx
    section: DCTA member cities

  - name: Lewisville
    type: legistar
    client: cityoflewisville
    section: DCTA member cities

  - name: Highland Village
    type: link_page
    # CivicPlus Archive Center: 50 = City Council agendas, 57 = special meeting agendas.
    urls:
      - https://www.highlandvillage.org/Archive.aspx?AMID=50
      - https://www.highlandvillage.org/Archive.aspx?AMID=57
    link_pattern: 'Archive\.aspx\?ADID=\d+'
    link_text_pattern: '^(?!.*cancel)'     # skip "November 24, 2026 - Canceled"
    meeting_name: City Council
    max_links: 40
    section: DCTA member cities

  # ---------------------------------------------------------------- Trinity Metro member & associate cities
  # Fort Worth is the full (sales-tax) member; the others have partial/associate
  # membership through interlocal agreements (TEXRail stations, On-Demand, paratransit).
  - name: Fort Worth
    type: docspublished
    org: fortworthtexas      # moved from Legistar (fortworthgov) on June 17, 2026
    # Reads each agenda's sections, item titles and attachment titles. The full agenda
    # PDFs (100-350 MB) aren't available through the public API.
    section: Trinity Metro member & associate cities

  - name: Grapevine
    type: link_page
    # CivicPlus Archive Center: 48 = City Council agendas, 52 = City Council packets.
    urls:
      - https://www.grapevinetexas.gov/Archive.aspx?AMID=48
      - https://www.grapevinetexas.gov/Archive.aspx?AMID=52
    link_pattern: 'Archive\.aspx\?ADID=\d+'
    link_text_pattern: '^(?!.*(cancel|no meeting))'
    meeting_name: City Council
    skip_undated: true
    max_links: 40
    section: Trinity Metro member & associate cities

  - name: North Richland Hills
    type: legistar
    client: nrhtx
    section: Trinity Metro member & associate cities

  - name: Forest Hill
    type: civicclerk
    tenant: foresthilltx
    section: Trinity Metro member & associate cities

  - name: River Oaks
    type: link_page
    # CivicPlus Agenda Center; links look like /AgendaCenter/ViewFile/Agenda/_11172026-421
    urls:
      - https://www.riveroakstx.com/AgendaCenter
    link_pattern: '/AgendaCenter/ViewFile/Agenda/_\d{8}-\d+'
    exclude_pattern: 'municipal court'   # court dockets aren't meeting agendas
    skip_undated: true
    max_links: 40
    section: Trinity Metro member & associate cities

  # ---------------------------------------------------------------- regional bodies
  - name: RTC (NCTCOG)
    section: Regional
    city: Regional Transportation Council
    type: link_page
    # NCTCOG lists each RTC meeting's agenda and full packet ("Agenda (including all meeting
    # materials)"); the date comes from the file name, e.g. agendapacketrtc11052026.pdf.
    urls:
      - https://www.nctcog.org/trans/about/committees/regional-transportation-council
    link_pattern: '/getContentAsset/.+\.pdf'
    link_text_pattern: '^Agenda'
    meeting_name: Regional Transportation Council
    skip_undated: true        # 2022-23 archive files have no usable date in their names
    max_links: 60

  # ---------------------------------------------------------------- counties
  - name: Dallas County
    section: Counties
    type: civicweb
    base_url: https://dallascounty.civicweb.net
    meeting_types: ["Commissioners Court", "Commissioners Court - Special Called Session"]
    # html = agenda item titles (~200 KB, available right away); pdf = the full agenda with
    # every briefing (often 100+ MB, ~3 min to read; needs max_download_mb above its size).
    format: both

  - name: Collin County
    type: link_page
    # eAgenda portal (same software as Addison). Each meeting's page is the full agenda with
    # item descriptions, so read those pages rather than the hundreds of attachment PDFs.
    urls:
      - https://eagenda.collincountytx.gov/agenda_publish.cfm
      - https://eagenda.collincountytx.gov/agenda_publish.cfm?id=&mt=ALL&get_month={month}&get_year={year}&dsp=ag&seq=
    months_back: 1
    link_pattern: 'agenda_publish\.cfm\?.*dsp=ag&seq=\d+'
    skip_undated: true
    max_links: 30
    section: Counties

  - name: Denton County
    type: granicus
    # Commissioners Court agendas go up under "Upcoming Events" before each meeting.
    url: https://dentoncounty.granicus.com/ViewPublisher.php?view_id=26
    section: Counties

  # Tarrant County: its agendas are only in an AgendaLink portal whose API needs a token
  # embedded in the app, so it isn't read here. See README.

