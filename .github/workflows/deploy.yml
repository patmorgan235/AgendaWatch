name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC sign-in to Azure as the deploy managed identity

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-hosted.txt pytest reportlab
      - run: pytest -q

  deploy:
    # Runs once the repo variables from infra/deploy.sh's output are set.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          server="${{ vars.ACR_NAME }}.azurecr.io"
          image="$server/agendawatch:${GITHUB_SHA::7}"
          docker build -t "$image" -t "$server/agendawatch:latest" .
          az acr login -n "${{ vars.ACR_NAME }}"
          docker push "$image"
          docker push "$server/agendawatch:latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Point the job at the new image
        run: |
          az containerapp job update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.JOB_NAME }}" \
            --image "$IMAGE" -o none
          echo "Job ${{ vars.JOB_NAME }} now runs $IMAGE" >> "$GITHUB_STEP_SUMMARY"
